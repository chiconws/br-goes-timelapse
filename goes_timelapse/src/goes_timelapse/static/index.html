<!doctype html>
<html lang="pt-BR" data-base-path="__BASE_PATH__">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Timelapses GOES de Municípios</title>
    <link rel="stylesheet" href="__STYLE_HREF__" />
  </head>
  <body>
    <header class="topbar">
      <h1>GOES timelapses de municípios</h1>
      <div class="search">
        <label class="visually-hidden" for="area-search">Buscar município</label>
        <input
          id="area-search"
          type="search"
          placeholder="Buscar município, estado ou código IBGE"
          autocomplete="off"
        />
        <div id="search-results" class="search-results" hidden></div>
      </div>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="true">
        Tema claro
      </button>
    </header>

    <p id="search-feedback" class="feedback" role="status" hidden></p>

    <main id="tracked-list" class="viewer">
      <p class="viewer-empty">Carregando municípios...</p>
    </main>

    <details class="service">
      <summary id="service-summary">Carregando status do serviço...</summary>
      <div class="service-body">
        <dl id="status-grid" class="service-facts"></dl>
        <div id="downloads-list" class="service-sources">
          <p class="muted">Carregando downloads...</p>
        </div>
      </div>
    </details>

    <script src="__SCRIPT_CORE_SRC__" defer></script>
    <script src="__SCRIPT_RENDER_SRC__" defer></script>
    <script src="__SCRIPT_ACTIONS_SRC__" defer></script>
    <script src="__SCRIPT_SRC__" defer></script>
  </body>
</html>
